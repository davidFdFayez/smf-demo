# Single-origin SPA server for the public web app.
# Serves the built React bundle and reverse-proxies /api and /hubs to the
# .NET API container on the shared Docker network (resolved by service name).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    # --- SPA static assets -------------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets (Vite fingerprints every chunk).
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # --- JSON/REST API (proxied to the .NET container) --------------------
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Swagger stays reachable for the demo (useful when the manager asks to
    # see the API surface).
    location /swagger/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- SignalR hubs (WebSocket upgrade) ---------------------------------
    location /hubs/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /hubs/matches and /hubs/tournaments.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # Keep long-poll and WebSocket connections open.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # index.html must never be cached, otherwise browsers keep loading an old
    # SPA shell that references stale (deleted) asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # --- SPA history-mode fallback ----------------------------------------
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
